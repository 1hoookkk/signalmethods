[workspace]
members = ["trench-core", "author", "author-server", "trench-app"]
resolver = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Response evaluation and packed decoding run on every repaint. Keep the
# authoring core optimized in development builds.
[profile.dev.package.trench-core]
opt-level = 3

[profile.dev.package.trench-app]
opt-level = 2

[profile.dev.build-override]
opt-level = 0

[profile.dev.package.naga]
opt-level = 1

[profile.dev.package.wgpu-core]
opt-level = 1

[profile.dev.package.wgpu-hal]
opt-level = 1
