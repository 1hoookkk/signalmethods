[package]
name = "trench-core"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

# End-to-end transfer-function system-ID / body-authoring pipeline. Lives here
# because it is a pure consumer of the owned packed runtime (pack / interpolate /
# response / certify) — no second kernel. Only serde/std, so it builds without
# the workstation GUI stack.
[[bin]]
name = "motion-lab"
path = "src/bin/motion_lab.rs"

[[bin]]
name = "render-qa"
path = "src/bin/render_qa.rs"

[[bin]]
name = "pole_proof"
path = "src/bin/pole_proof.rs"

[[bin]]
name = "hd-ab"
path = "src/bin/hd_ab.rs"

[[bin]]
name = "tf-oracle"
path = "src/bin/tf_oracle.rs"

[[bin]]
name = "body-from-geometry"
path = "src/bin/body_from_geometry.rs"

[[bin]]
name = "motion_gap_proof"
path = "src/bin/motion_gap_proof.rs"

[[bin]]
name = "motion_take_proof"
path = "src/bin/motion_take_proof.rs"


[[bin]]
name = "rate-ab"
path = "src/bin/rate_ab.rs"

[[bin]]
name = "slam-alias-probe"
path = "src/bin/slam_alias_probe.rs"

[[bin]]
name = "slam-ab-render"
path = "src/bin/slam_ab_render.rs"

[[bin]]
name = "listener-probe"
path = "src/bin/listener_probe.rs"

[[bin]]
name = "env-probe"
path = "src/bin/env_probe.rs"

[[bin]]
name = "bloom-probe"
path = "src/bin/bloom_probe.rs"

[[bin]]
name = "corner-contrast"
path = "src/bin/corner_contrast.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[[bin]]
name = "null-render"
path = "src/bin/null_render.rs"

[[bin]]
name = "rom-null"
path = "src/bin/rom_null.rs"

[[bin]]
name = "armadillo-check"
path = "src/bin/armadillo_check.rs"

[[bin]]
name = "hf-flatness"
path = "src/bin/hf_flatness.rs"

[[bin]]
name = "morph-path"
path = "src/bin/morph_path.rs"

[[bin]]
name = "make-body"
path = "src/bin/make_body.rs"

[[bin]]
name = "compose-body"
path = "src/bin/compose_body.rs"

[[bin]]
name = "carve-ab"
path = "src/bin/carve_ab.rs"

[[bin]]
name = "topology-gate"
path = "src/bin/topology_gate.rs"

[[bin]]
name = "cube"
path = "src/bin/cube.rs"
