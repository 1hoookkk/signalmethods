<!doctype html>
<meta charset="utf-8">
<title>E-mu z-plane study</title>
<style>
  :root{
    --page:#f4f4f1; --panel:#fcfcfb; --well:#0e0e12; --grat:#23232a;
    --gratm:#3a3a44; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --line:#e1e0d9; --accent:#2a78d6;
    --c0:#2a78d6; --c1:#eb6834; --c2:#1baf7a; --c3:#a05ad6;
    --c4:#e8b13a; --c5:#e87ba4; --c6:#48c8ff; --c7:#8bd450;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);
    font:13px/1.45 "Segoe UI",system-ui,sans-serif;overflow:hidden}
  #app{display:grid;grid-template-columns:230px 1fr 300px;height:100vh}
  .col{min-width:0;display:flex;flex-direction:column}
  .pane{background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0}
  .pane.right{border-right:none;border-left:1px solid var(--line)}
  h1{font-size:13px;margin:0;padding:10px 12px;border-bottom:1px solid var(--line);
    font-weight:700;letter-spacing:.02em}
  .sub{font-size:11px;color:var(--muted);padding:0 12px 8px}
  #search{margin:8px 10px;padding:6px 8px;border:1px solid var(--line);
    border-radius:5px;font:12px inherit;background:#fff}
  #list{flex:1;overflow-y:auto;padding:0 6px 10px}
  .item{padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;
    display:flex;justify-content:space-between;gap:6px}
  .item:hover{background:#eef2f7}
  .item.on{background:var(--accent);color:#fff}
  .item i{font-style:normal;color:var(--muted);font-size:10px}
  .item.on i{color:#cfe2ff}
  .bar{display:flex;align-items:center;gap:8px;padding:8px 12px;
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  .corner{padding:3px 9px;border:1px solid var(--line);background:#fff;
    border-radius:4px;cursor:pointer;font:11px/1.4 ui-monospace,monospace}
  .corner.on{color:#fff;border-color:transparent}
  .corner.dead{opacity:.35;cursor:not-allowed}
  #main{flex:1;display:flex;flex-direction:column;min-height:0;padding:10px;
    gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:7px;
    padding:8px;display:flex;flex-direction:column;min-height:0}
  .card h2{font-size:11px;margin:0 0 6px;color:var(--ink2);font-weight:600;
    display:flex;justify-content:space-between}
  canvas{display:block;width:100%;background:var(--well);border-radius:4px}
  #cascadeWrap{flex:1;min-height:0}
  #cascade{height:100%}
  #stages{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:250px}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:5px;display:flex;flex-direction:column;gap:2px;min-height:0}
  .stage b{font-size:10px;color:var(--ink2)}
  .stage span{font-size:9px;color:var(--muted);font-family:ui-monospace,monospace}
  .stage canvas{flex:1;min-height:0}
  .stage .lbl{font-size:8.5px;color:var(--muted);text-align:center}
  .stage.off{opacity:.4}
  #roots{height:230px}
  .meta{font-size:11px;color:var(--ink2);padding:8px 12px;line-height:1.7;
    font-family:ui-monospace,monospace;overflow-y:auto}
  .meta b{color:var(--ink)}
  #perf{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted)}
  label.chk{font-size:11px;color:var(--ink2);display:flex;align-items:center;
    gap:4px;cursor:pointer}
</style>

<div id="app">
  <div class="col pane">
    <h1>CORPUS</h1>
    <input id="search" placeholder="filter by name…">
    <div id="list"></div>
  </div>

  <div class="col" style="background:var(--page)">
    <div class="bar">
      <strong id="title">—</strong>
      <span id="corners"></span>
      <label class="chk"><input type="checkbox" id="allCorners" checked>
        overlay all corners</label>
      <label class="chk"><input type="checkbox" id="sortFreq">
        order lanes by pole frequency</label>
      <span id="perf"></span>
      <button id="bench" class="corner">bench 120 frames</button>
    </div>
    <div id="main">
      <div class="card" id="cascadeWrap">
        <h2><span>COMPOUND CASCADE &nbsp;H(z) = ∏ H<sub>k</sub>(z)</span>
            <span id="readout"></span></h2>
        <canvas id="cascade"></canvas>
      </div>
      <div id="stages"></div>
    </div>
  </div>

  <div class="col pane right">
    <h1>ROOTS — drag to edit</h1>
    <canvas id="roots"></canvas>
    <div class="meta" id="meta"></div>
  </div>
</div>

<script type="module">
const FS_DEFAULT = 39062.5;
const NBIN = 8192, HZ_LO = 20, DB_LO = -90, DB_HI = 45;
const CCOL = ['--c0','--c1','--c2','--c3','--c4','--c5','--c6','--c7']
  .map(v => getComputedStyle(document.documentElement).getPropertyValue(v).trim());
const _cssCache = {};
for(const n of ['--well','--grat','--gratm','--muted','--ink','--line'])
  _cssCache[n] = getComputedStyle(document.documentElement)
    .getPropertyValue(n).trim();
const css = n => _cssCache[n];

let SR = FS_DEFAULT, NYQ = SR/2;
let freq, cw, sw, c2, s2;           // per-bin trig tables
function buildTables(sr){
  SR = sr; NYQ = sr/2;
  freq = new Float64Array(NBIN);
  cw = new Float64Array(NBIN); sw = new Float64Array(NBIN);
  c2 = new Float64Array(NBIN); s2 = new Float64Array(NBIN);
  const lo = Math.log(HZ_LO), hi = Math.log(NYQ*0.999);
  for(let i=0;i<NBIN;i++){
    const f = Math.exp(lo + (hi-lo)*i/(NBIN-1));
    const w = 2*Math.PI*f/sr;
    freq[i]=f; cw[i]=Math.cos(w); sw[i]=Math.sin(w);
    c2[i]=Math.cos(2*w); s2[i]=Math.sin(2*w);
  }
}
buildTables(FS_DEFAULT);

// a section is 4 polynomial numbers: numerator (An,Bn), denominator (Ad,Bd)
// N(z) = 1 - An z^-1 + Bn z^-2 ,  D(z) = 1 - Ad z^-1 + Bd z^-2
function pairAB(hz, r, realA, realB){
  if(realA !== null && realA !== undefined)
    return [realA + realB, realA * realB];
  const w = 2*Math.PI*hz/SR;
  return [2*r*Math.cos(w), r*r];
}
function sectionDb(sec, out){
  const [An,Bn] = sec.num, [Ad,Bd] = sec.den;
  for(let i=0;i<NBIN;i++){
    const nr = 1 - An*cw[i] + Bn*c2[i], ni = An*sw[i] - Bn*s2[i];
    const dr = 1 - Ad*cw[i] + Bd*c2[i], di = Ad*sw[i] - Bd*s2[i];
    const n2 = nr*nr + ni*ni, d2 = dr*dr + di*di;
    out[i] = 10*Math.log10((n2 < 1e-30 ? 1e-30 : n2) /
                           (d2 < 1e-30 ? 1e-30 : d2));
  }
  return out;
}

const xOf = (f,w)=> (Math.log(f/HZ_LO)/Math.log(NYQ*0.999/HZ_LO))*w;
const hzOf = (x,w)=> HZ_LO*Math.pow(NYQ*0.999/HZ_LO, Math.min(1,Math.max(0,x/w)));
const yOf = (db,h)=> h - ((db-DB_LO)/(DB_HI-DB_LO))*h;

const _cvState = new WeakMap();
let _needMeasure = true;
function fitCanvas(cv){
  let st = _cvState.get(cv);
  if(!st || _needMeasure){
    const r = cv.getBoundingClientRect(), d = window.devicePixelRatio||1;
    const W = Math.round(r.width*d), H = Math.round(r.height*d);
    if(cv.width!==W || cv.height!==H){ cv.width=W; cv.height=H; }
    const g = cv.getContext('2d');
    g.setTransform(d,0,0,d,0,0);
    st = {g, w:r.width, h:r.height};
    _cvState.set(cv, st);
  }
  return [st.g, st.w, st.h];
}
function grid(g,w,h,small){
  g.fillStyle = css('--well'); g.fillRect(0,0,w,h);
  g.lineWidth = 1; g.strokeStyle = css('--grat');
  for(let db=DB_LO; db<=DB_HI; db+=10){
    const y = Math.round(yOf(db,h))+0.5;
    g.strokeStyle = db===0 ? css('--gratm') : css('--grat');
    g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke();
  }
  const ticks = small ? [100,1000,10000] : [20,50,100,200,500,1000,2000,5000,10000];
  g.strokeStyle = css('--grat');
  for(const f of ticks){
    if(f>NYQ) continue;
    const x = Math.round(xOf(f,w))+0.5;
    g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke();
  }
  if(!small){
    g.fillStyle = css('--muted'); g.font='10px ui-monospace,monospace';
    for(const f of ticks){
      if(f>NYQ) continue;
      g.fillText(f>=1000?(f/1000)+'k':''+f, xOf(f,w)+3, h-4);
    }
    for(let db=DB_LO+10; db<DB_HI; db+=20)
      g.fillText(db>0?'+'+db:''+db, 3, yOf(db,h)-3);
  }
}
function trace(g,curve,w,h,color,width){
  // X3 trace law: oversample and peak-hold per pixel column so a notch
  // narrower than one column still reaches the screen.
  const cols = Math.max(2, Math.round(w));
  g.strokeStyle = color; g.lineWidth = width;
  g.lineJoin = 'round'; g.lineCap = 'round';
  const clamp = v => v < DB_LO-20 ? DB_LO-20 : (v > DB_HI+20 ? DB_HI+20 : v);
  const mn = new Float64Array(cols), mx = new Float64Array(cols);
  mn.fill(Infinity); mx.fill(-Infinity);
  for(let i=0;i<NBIN;i++){
    const c = (i/(NBIN-1))*(cols-1)|0;
    const v = clamp(curve[i]);
    if(v < mn[c]) mn[c] = v;
    if(v > mx[c]) mx[c] = v;
  }
  // carry the last seen value across empty columns
  let last = null;
  for(let c=0;c<cols;c++){
    if(mn[c] === Infinity){ if(last!==null){ mn[c]=last; mx[c]=last; } }
    else last = mx[c];
  }
  g.beginPath();
  let started = false;
  for(let c=0;c<cols;c++){
    if(mn[c] === Infinity) continue;
    const x = c + 0.5;
    const yTop = yOf(mx[c],h), yBot = yOf(mn[c],h);
    if(!started){ g.moveTo(x,yTop); started = true; }
    else g.lineTo(x,yTop);
    if(yBot - yTop > 0.75) g.lineTo(x,yBot);   // vertical span of this column
  }
  g.stroke();
}

let CORPUS = null, obj = null, cornerIx = 0, overlayAll = true;
let sections = [], scratch = [], total = new Float64Array(NBIN);
let perCorner = [];

function buildSections(o, ci){
  const c = o.corners[ci];
  const out = [];
  for(const s of c.s){
    const [ph,pr,zh,zr,dead, pa,pb, za,zb] = s;
    if(dead) { out.push(null); continue; }
    out.push({
      ph, pr, zh, zr,
      num: pairAB(zh, zr, za===undefined?null:za, zb),
      den: pairAB(ph, pr, pa===undefined?null:pa, pb),
    });
  }
  return out;
}
function evalCorner(o, ci, into){
  const secs = buildSections(o, ci);
  into.fill(0);
  const tmp = new Float64Array(NBIN);
  let live = 0;
  for(const s of secs){
    if(!s) continue;
    sectionDb(s, tmp);
    for(let i=0;i<NBIN;i++) into[i]+=tmp[i];
    live++;
  }
  const g = o.corners[ci].g ?? 1;
  const gdb = 20*Math.log10(Math.max(g,1e-12));
  for(let i=0;i<NBIN;i++) into[i]+=gdb;
  return live;
}
const isDead = (o,ci)=> o.corners[ci].s.every(s=>s[4]===1);

function selectObject(o){
  obj = o;
  document.getElementById('title').textContent = o.n;
  const cbox = document.getElementById('corners'); cbox.innerHTML='';
  perCorner = [];
  for(let i=0;i<o.corners.length;i++){
    const arr = new Float64Array(NBIN);
    if(!isDead(o,i)) evalCorner(o,i,arr); else arr.fill(NaN);
    perCorner.push(arr);
    const b = document.createElement('button');
    b.className = 'corner' + (isDead(o,i)?' dead':'');
    b.textContent = 'c'+i;
    b.style.background = isDead(o,i) ? '' : CCOL[i%8];
    if(!isDead(o,i)) b.style.color='#fff';
    b.onclick = ()=>{ if(!isDead(o,i)){ cornerIx=i; syncCorner(); draw(); } };
    cbox.appendChild(b);
  }
  cornerIx = o.corners.findIndex((_,i)=>!isDead(o,i));
  if(cornerIx<0) cornerIx=0;
  syncCorner(); buildStageCards(); _needMeasure=true; _metaDirty=true;
  draw(); _needMeasure=false;
}
function syncCorner(){
  sections = buildSections(obj, cornerIx);
  [...document.querySelectorAll('.corner')].forEach((b,i)=>
    b.classList.toggle('on', i===cornerIx));
}
function laneOrder(){
  const idx = sections.map((s,i)=>i);
  if(!sortFreq) return idx;
  return idx.slice().sort((a,b)=>{
    const A = sections[a], B = sections[b];
    if(!A) return 1; if(!B) return -1;
    return A.ph - B.ph;
  });
}
function buildStageCards(){
  const box = document.getElementById('stages');
  box.innerHTML='';
  box.style.gridTemplateColumns = `repeat(${obj.ns},1fr)`;
  for(let k=0;k<obj.ns;k++){
    const d = document.createElement('div'); d.className='stage';
    d.id = 'st'+k;
    d.innerHTML = `<b id="sb${k}">S${k+1}</b><span id="sl${k}"></span>
                   <canvas id="sc${k}"></canvas>
                   <div class="lbl" id="tv${k}"></div>
                   <canvas id="cc${k}"></canvas>
                   <div class="lbl" id="cl${k}"></div>`;
    box.appendChild(d);
  }
}

let lastMs = 0;
const _tmp = new Float64Array(NBIN);
const _cum = new Float64Array(NBIN);
let sortFreq = false;
const _stageCurves = [];
function draw(){
  const t0 = performance.now();
  // compound
  {
    const [g,w,h] = fitCanvas(document.getElementById('cascade'));
    grid(g,w,h,false);
    if(overlayAll){
      for(let i=0;i<perCorner.length;i++){
        if(isDead(obj,i)) continue;
        trace(g,perCorner[i],w,h,CCOL[i%8], i===cornerIx?2.2:1.1);
      }
    } else {
      evalCorner(obj,cornerIx,total);
      trace(g,total,w,h,CCOL[cornerIx%8],2.2);
    }
  }
  // stage cards: top = this stage's own factor, bottom = cumulative prefix
  const tmp = _tmp;
  const order = laneOrder();
  const cum = _cum;
  cum.fill(0);
  for(let slot=0; slot<obj.ns; slot++){
    const k = order[slot];
    const s = sections[k];
    const card = document.getElementById('st'+slot);
    const cv = document.getElementById('sc'+slot);
    const cc = document.getElementById('cc'+slot);
    if(!cv||!cc) continue;
    document.getElementById('sb'+slot).textContent =
      sortFreq ? `S${k+1}` : `S${k+1}`;
    card.classList.toggle('off', !s);
    const [g,w,h] = fitCanvas(cv);
    grid(g,w,h,true);
    if(s){
      sectionDb(s,tmp);
      trace(g,tmp,w,h,CCOL[cornerIx%8],1.6);
      let mn=Infinity,mx=-Infinity,sum=0;
      for(let i=0;i<NBIN;i++){ const v=tmp[i];
        if(v<mn)mn=v; if(v>mx)mx=v; sum+=v; }
      document.getElementById('sl'+slot).textContent =
        `${s.ph.toFixed(0)}·${s.pr.toFixed(3)}`;
      document.getElementById('tv'+slot).textContent =
        `travel ${(mx-mn).toFixed(0)} dB · level ${(sum/NBIN>=0?'+':'')}${(sum/NBIN).toFixed(0)} dB`;
      for(let i=0;i<NBIN;i++) cum[i]+=tmp[i];
    } else {
      document.getElementById('sl'+slot).textContent='—';
      document.getElementById('tv'+slot).textContent='idle';
    }
    const [g2,w2,h2] = fitCanvas(cc);
    grid(g2,w2,h2,true);
    trace(g2,cum,w2,h2,'#c9ccd1',1.5);
    document.getElementById('cl'+slot).textContent =
      slot===0 ? 'C1' : `C1..${slot+1}`;
  }
  drawRoots();
  lastMs = performance.now()-t0;
  document.getElementById('perf').textContent =
    `${lastMs.toFixed(2)} ms/frame · ${NBIN} bins × ${obj.ns} sections`;
  if(_metaDirty){ writeMeta(); _metaDirty=false; }
}

const RP_MAX = 60;
const rprime = r => r>=1?RP_MAX : r<=0?0 : Math.min(RP_MAX,20*Math.log10(1/(1-r)));
const rOf = rp => 1-Math.pow(10,-rp/20);
function drawRoots(){
  const [g,w,h] = fitCanvas(document.getElementById('roots'));
  g.fillStyle=css('--well'); g.fillRect(0,0,w,h);
  g.strokeStyle=css('--grat'); g.lineWidth=1;
  for(const f of [100,1000,10000]){
    if(f>NYQ) continue;
    const x=Math.round(xOf(f,w))+0.5;
    g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke();
  }
  for(let rp=0;rp<=RP_MAX;rp+=20){
    const y=Math.round(h-(rp/RP_MAX)*h)+0.5;
    g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke();
  }
  g.font='9px ui-monospace,monospace';
  for(let k=0;k<sections.length;k++){
    const s = sections[k]; if(!s) continue;
    const col = CCOL[k%8];
    const px = xOf(Math.min(Math.max(s.ph,HZ_LO),NYQ*0.999),w);
    const py = h-(rprime(s.pr)/RP_MAX)*h;
    if(s.zr>0.02){
      const zx = xOf(Math.min(Math.max(s.zh,HZ_LO),NYQ*0.999),w);
      const zy = h-(rprime(s.zr)/RP_MAX)*h;
      g.strokeStyle=col; g.globalAlpha=.35;
      g.beginPath(); g.moveTo(px,py); g.lineTo(zx,zy); g.stroke();
      g.globalAlpha=1;
      g.beginPath(); g.arc(zx,zy,5,0,7); g.lineWidth=2; g.stroke();
      g.fillStyle=col; g.fillText('S'+(k+1), zx+7, zy+3);
    }
    if(s.pr>0.02){
      g.fillStyle=col; g.beginPath(); g.arc(px,py,5,0,7); g.fill();
      g.fillText('S'+(k+1), px+7, py+3);
    }
  }
}

let drag = null;
const rootsCv = document.getElementById('roots');
rootsCv.addEventListener('pointerdown', e=>{
  const r = rootsCv.getBoundingClientRect();
  const mx = e.clientX-r.left, my = e.clientY-r.top;
  let best=null, bd=14;
  for(let k=0;k<sections.length;k++){
    const s=sections[k]; if(!s) continue;
    for(const kind of ['pole','zero']){
      const hz = kind==='pole'?s.ph:s.zh, rr = kind==='pole'?s.pr:s.zr;
      if(rr<=0.02) continue;
      const x=xOf(Math.min(Math.max(hz,HZ_LO),NYQ*0.999),r.width);
      const y=r.height-(rprime(rr)/RP_MAX)*r.height;
      const d=Math.hypot(x-mx,y-my);
      if(d<bd){ bd=d; best={k,kind}; }
    }
  }
  if(best){ drag=best; rootsCv.setPointerCapture(e.pointerId); }
});
rootsCv.addEventListener('pointermove', e=>{
  if(!drag) return;
  const r = rootsCv.getBoundingClientRect();
  const hz = hzOf(e.clientX-r.left, r.width);
  const rp = (1-Math.min(1,Math.max(0,(e.clientY-r.top)/r.height)))*RP_MAX;
  const s = sections[drag.k];
  const rr = Math.min(rOf(rp), drag.kind==='zero'?1:0.99995);
  if(drag.kind==='pole'){ s.ph=hz; s.pr=rr; s.den=pairAB(hz,rr); }
  else { s.zh=hz; s.zr=rr; s.num=pairAB(hz,rr); }
  evalCorner2(); _metaDirty=true; draw();
});
addEventListener('pointerup', ()=>{ drag=null; });
function evalCorner2(){
  const tmp=_tmp; const arr=perCorner[cornerIx];
  arr.fill(0);
  for(const s of sections){ if(!s) continue;
    sectionDb(s,tmp); for(let i=0;i<NBIN;i++) arr[i]+=tmp[i]; }
  const g=obj.corners[cornerIx].g??1;
  const gdb=20*Math.log10(Math.max(g,1e-12));
  for(let i=0;i<NBIN;i++) arr[i]+=gdb;
}

document.getElementById('cascade').addEventListener('pointermove', e=>{
  const r=e.target.getBoundingClientRect();
  const hz=hzOf(e.clientX-r.left,r.width);
  const i=Math.round((e.clientX-r.left)/r.width*(NBIN-1));
  const db=perCorner[cornerIx]?.[Math.max(0,Math.min(NBIN-1,i))];
  document.getElementById('readout').textContent =
    `${hz<1000?hz.toFixed(0):(hz/1000).toFixed(2)+'k'} Hz   ${db?.toFixed(1)} dB`;
});

let _metaDirty = true;
function writeMeta(){
  const live = sections.filter(Boolean).length;
  const rows = sections.map((s,k)=> s
    ? `S${k+1}  p ${s.ph.toFixed(0).padStart(6)} r${s.pr.toFixed(4)}` +
      (s.zr>0.02?`\n     z ${s.zh.toFixed(0).padStart(6)} r${s.zr.toFixed(4)}`:'')
    : `S${k+1}  —`).join('\n');
  document.getElementById('meta').innerHTML =
    `<b>${obj.n}</b> · corner ${cornerIx} · ${live}/${obj.ns} live<br>` +
    `datum ${SR} Hz<pre style="margin:6px 0;font-size:11px">${rows}</pre>`;
}

document.getElementById('bench').onclick = ()=>{
  const N=120, t0=performance.now();
  for(let i=0;i<N;i++) draw();
  const per=(performance.now()-t0)/N;
  document.getElementById('perf').textContent =
    `${per.toFixed(3)} ms/frame over ${N} frames · ${NBIN} bins × ${obj.ns} sections`;
};
document.getElementById('allCorners').onchange = e=>{
  overlayAll = e.target.checked; draw();
};
document.getElementById('sortFreq').onchange = e=>{
  sortFreq = e.target.checked; _needMeasure=true; draw(); _needMeasure=false;
};
document.getElementById('search').oninput = e=> renderList(e.target.value);
function renderList(q=''){
  const box=document.getElementById('list'); box.innerHTML='';
  const ql=q.toLowerCase();
  for(const o of CORPUS.objects){
    if(ql && !o.n.toLowerCase().includes(ql)) continue;
    const d=document.createElement('div');
    d.className='item'+(obj&&obj.n===o.n?' on':'');
    d.innerHTML=`<span>${o.n}</span><i>${o.c==='p2k'?'P2K':'MOR'} ${o.ns}</i>`;
    d.onclick=()=>{ selectObject(o); renderList(q); };
    box.appendChild(d);
  }
}
addEventListener('resize', ()=>{ _needMeasure=true; if(obj){draw(); _needMeasure=false;} });

fetch('data/emu_study.json').then(r=>r.json()).then(j=>{
  CORPUS=j; buildTables(j.sr);
  renderList();
  selectObject(j.objects.find(o=>o.n==='TalkingHedz') || j.objects[0]);
});
</script>
