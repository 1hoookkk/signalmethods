<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PARITY</title>
<style>body{background:#0a0e0c;color:#00f0b4;font-family:monospace;padding:20px}</style>
</head>
<body>
<pre id="out">running…</pre>
<script type="module">
import { interpolateWords, interpolateBiquad, rowDb } from "./js/dsp.js";
const out = document.getElementById("out");
const grid = Array.from({ length: 128 }, (_, i) => 40 * Math.pow(16000 / 40, i / 127));
try {
  const v = await (await fetch("/api/parity_vectors?n=256")).json();
  let worst = 0;
  for (const c of v.cases) {
    const words = interpolateWords(v.words, c.m, c.q, c.z);
    const rows = interpolateBiquad(v.words, c.m, c.q, c.z);
    for (let s = 0; s < 7; s++) {
      for (let i = 0; i < 5; i++) {
        if (words[s][i] !== c.iwords[s][i]) throw new Error(`word mismatch S${s + 1} w${i} at (${c.m},${c.q},${c.z})`);
        if (rows[s][i] !== c.rows[s][i]) throw new Error(`row mismatch S${s + 1} c${i} at (${c.m},${c.q},${c.z})`);
      }
    }
    for (let i = 0; i < grid.length; i++) {
      const db = rows.reduce((sum, r) => sum + rowDb(r, grid[i], v.sr), 0);
      worst = Math.max(worst, Math.abs(db - c.curve[i]));
      if (worst > 1e-9) throw new Error(`curve mismatch at ${grid[i].toFixed(1)} Hz`);
    }
  }
  out.textContent = `PARITY PASS — ${v.cases.length} interior points\nwords: integer-exact\nbiquad rows: bit-exact\ncurve: worst ${worst.toExponential(2)} dB\nthe browser speaks the hardware's interpolation law`;
} catch (e) {
  out.style.color = "#ff4040";
  out.textContent = `PARITY FAIL — ${e.message}`;
}
</script>
</body>
</html>
