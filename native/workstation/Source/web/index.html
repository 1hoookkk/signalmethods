<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>HEADSPACE</title>
<style>
  :root { --ground:#161718; --panel:#1f2124; --rule:#a8abb0; --grid:#2e3136; --ink:#eceef0; --text:#d2d5d9; --dim:#8a8e94; --faint:#45494f; --blue:#4fa3e6; --orange:#f08a45; --yellow:#f0c24a; --purple:#b98ad6; --green:#96cf5a; }
  html, body { margin:0; height:100%; background:var(--ground); color:var(--text); font:11px "Segoe UI", system-ui, sans-serif; overflow:hidden; user-select:none; }
  #root { position:absolute; inset:0; display:grid; grid-template-columns: 1fr 1fr; grid-template-rows: 22px 1fr 1fr; gap:12px; padding:12px; box-sizing:border-box; }
  #title { grid-column: 1 / 3; color:var(--dim); letter-spacing:.08em; }
  .pane { border:1px solid var(--faint); position:relative; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
  .word { position:absolute; cursor:default; color:var(--dim); letter-spacing:.06em; font-size:10px; }
  .word.on { color:var(--ink); }
  .word.faint { color:var(--faint); }
  #list { position:absolute; left:0; top:0; bottom:0; width:48%; overflow-y:auto; border-right:1px solid var(--faint); }
  #list .head { padding:6px 8px 2px; color:var(--dim); font-size:10px; letter-spacing:.06em; display:flex; justify-content:space-between; cursor:default; }
  #list .card { padding:4px 8px 4px 18px; color:var(--text); cursor:default; display:flex; justify-content:space-between; }
  #list .card.on { background:var(--panel); color:var(--ink); }
  #list .card .k { color:var(--faint); font-size:9px; }
  #status { position:absolute; right:8px; bottom:4px; color:var(--orange); }
</style>
</head>
<body>
<div id="root">
  <div id="title">HEADSPACE</div>
  <div class="pane" id="mother"><canvas id="motherC"></canvas></div>
  <div class="pane" id="stage"><canvas id="stageC"></canvas></div>
  <div class="pane" id="palette"><div id="list"></div><canvas id="paletteC" style="position:absolute; right:0; top:0; width:52%; height:100%"></canvas></div>
  <div class="pane" id="body"><canvas id="bodyC"></canvas><div id="status"></div></div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
