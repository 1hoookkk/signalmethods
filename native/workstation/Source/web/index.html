<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>HEADSPACE</title>
<style>
  :root { --ground:#161718; --panel:#1f2124; --rule:#a8abb0; --grid:#2e3136; --ink:#eceef0; --text:#d2d5d9; --dim:#8a8e94; --faint:#45494f; --blue:#4fa3e6; --orange:#f08a45; }
  html, body { margin:0; height:100%; background:rgba(22,23,24,0.72); color:var(--text); font:11px "Segoe UI", system-ui, sans-serif; overflow:hidden; user-select:none; }
  #pad { position:absolute; inset:0; display:block; width:100%; height:100%; }
  #find { position:absolute; left:10px; right:10px; bottom:8px; background:var(--panel); color:var(--ink); border:1px solid var(--faint); padding:4px 8px; font:11px "Segoe UI", system-ui, sans-serif; outline:none; }
  #find[hidden] { display:none; }
</style>
</head>
<body>
<canvas id="pad"></canvas>
<script type="module" src="/app.js"></script>
</body>
</html>
