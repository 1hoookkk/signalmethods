<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>HEADSPACE</title>
<style>
  :root { --ground:#161718; --panel:#1f2124; --rule:#a8abb0; --grid:#2e3136; --ink:#eceef0; --text:#d2d5d9; --dim:#8a8e94; --faint:#45494f; --blue:#4fa3e6; --orange:#f08a45; --yellow:#f0c24a; }
  html, body { margin:0; height:100%; background:var(--ground); color:var(--text); font:11px "Segoe UI", system-ui, sans-serif; overflow:hidden; user-select:none; }
  #root { position:absolute; inset:0; display:grid; grid-template-columns: 240px 1fr; grid-template-rows: 22px 1fr; gap:12px; padding:12px; box-sizing:border-box; }
  #title { grid-column: 1 / 3; color:var(--dim); letter-spacing:.08em; display:flex; justify-content:space-between; }
  #list { overflow-y:auto; border:1px solid var(--faint); }
  #list .head { padding:6px 8px 2px; color:var(--dim); font-size:10px; letter-spacing:.06em; display:flex; justify-content:space-between; cursor:default; }
  #list .card { padding:4px 8px 4px 18px; color:var(--text); cursor:default; }
  #list .card.on { background:var(--panel); color:var(--ink); }
  #corner { border:1px solid var(--faint); position:relative; display:grid; grid-template-rows: 1fr 160px; }
  canvas { display:block; width:100%; height:100%; }
  #words { display:grid; grid-template-columns: 24px 1fr 1fr 1fr 1fr 1fr; gap:0 8px; padding:8px 12px; font-variant-numeric: tabular-nums; align-content:start; border-top:1px solid var(--faint); }
  #words div { padding:2px 0; color:var(--text); }
  #words .h { color:var(--dim); font-size:10px; letter-spacing:.06em; }
  #words .n { color:var(--dim); }
  #words .lit { color:var(--ink); }
  #words .off { color:var(--faint); }
</style>
</head>
<body>
<div id="root">
  <div id="title"><span>HEADSPACE</span><span id="name"></span></div>
  <div id="list"></div>
  <div id="corner"><canvas id="plot"></canvas><div id="words"></div></div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
